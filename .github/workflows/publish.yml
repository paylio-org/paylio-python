name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  # -- Quality gates (must all pass before build) --------------------------------

  lint:
    name: Lint Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/

  test:
    name: Test Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=src/paylio --cov-branch --cov-fail-under=100 -q

  security:
    name: Security Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pip-audit --strict
      - run: bandit -r src/ -ll

  # -- Build ---------------------------------------------------------------------

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate with twine
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # -- Publish to TestPyPI -------------------------------------------------------

  publish-testpypi:
    name: TestPyPI
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/paylio
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  # -- Publish to PyPI -----------------------------------------------------------

  publish-pypi:
    name: PyPI
    runs-on: ubuntu-latest
    needs: [publish-testpypi]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/paylio
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
